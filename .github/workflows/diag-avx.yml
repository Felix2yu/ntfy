# 临时诊断工作流：定位 CI 产物中非受保护 AVX 指令（init_cpu_features vmovd/vpinsrd）的来源。
# 用完即删。
name: diag-avx
on:
  workflow_dispatch:
  push:
    branches: [main, 'diag/**']
    paths: ['.github/workflows/diag-avx.yml']
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Toolchain provenance
        run: |
          set -x
          gcc --version | head -1
          ldd --version | head -1
          L=$(gcc -print-file-name=libc.a)
          echo "libc.a=$L"
          ls -la "$L"
          sha256sum "$L"
          dpkg -S "$L" || true
          dpkg -S "$(gcc -print-file-name=crt1.o)" || true
          apt-cache policy libc6-dev libc6
          cat /etc/os-release
          grep -a 'Commandline:' /var/log/apt/history.log | tail -30
          ls -la /usr/local/lib /opt 2>/dev/null | head -30
          echo '--- compare against Ubuntu archive ---'
          curl -sL https://archive.ubuntu.com/ubuntu/pool/main/g/glibc/libc6-dev_2.43-2ubuntu2.4_amd64.deb -o /tmp/l.deb
          dpkg-deb -x /tmp/l.deb /tmp/l
          sha256sum /tmp/l/usr/lib/x86_64-linux-gnu/libc.a

      - name: Static hello (gcc)
        run: |
          printf 'int main(){return 0;}\n' > /tmp/h.c
          gcc -static -o /tmp/h /tmp/h.c
          echo "vpinsrd=$(objdump -d /tmp/h | grep -c vpinsrd || true)"
          echo "vmovd=$(objdump -d /tmp/h | grep -c 'vmovd' || true)"
          objdump -d /tmp/h | grep -A40 '<__libc_start_main' | sed -n '1,60p'
          objdump -d /tmp/h | grep -B2 -A8 'vmovd\|vpinsrd' | sed -n '1,60p'

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: CGO static hello (go, cold cache)
        run: |
          mkdir -p /tmp/cgoh
          cd /tmp/cgoh
          printf 'module cgoh\n\ngo 1.26\n' > go.mod
          printf 'package main\n\n// #include <stdio.h>\nimport "C"\n\nfunc main() { C.puts(C.CString("hi")) }\n' > main.go
          GOCACHE=/tmp/gocache CGO_ENABLED=1 GOOS=linux GOARCH=amd64 \
            go build -trimpath \
              -ldflags="-s -w -linkmode=external -extldflags=-static" \
              -o /tmp/cgoh-bin .
          echo "vpinsrd=$(objdump -d /tmp/cgoh-bin | grep -c vpinsrd || true)"
          echo "vmovd=$(objdump -d /tmp/cgoh-bin | grep -c vmovd || true)"

      - name: qemu Nehalem smoke test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static
          /tmp/cgoh-bin && echo NATIVE_OK
          qemu-x86_64-static -cpu Nehalem /tmp/cgoh-bin && echo NEHALEM_OK || echo NEHALEM_SIGILL
